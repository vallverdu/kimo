[package]
name = "kimo-fleet"
version = "0.1.15"
edition = "2021"
description = "Fleet coordinator for kimo: the machines, their power (Wake-on-LAN, shutdown), and the jobs and workflows that run on them"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "kimo-fleet"
path = "src/main.rs"

[dependencies]
# kimo's API client, access rules and network helpers; no window.
kimo = { path = "..", default-features = false }
anyhow = "1"
axum = "0.8"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net", "fs", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# TLS (certificate-checked, webpki roots): ntfy and ZeroTier Central are HTTPS; kimo itself
# needs none.
ureq = { version = "3", default-features = false, features = ["json", "rustls"] }
uuid = { version = "1", features = ["v4"] }
# Tapo plugs (core/tapo.rs): SPAKE2+ on P-256, then AES-128-CCM. RustCrypto, no C.
aes = "0.8"
base64 = "0.22"
ccm = "0.5"
hkdf = "0.12"
hmac = "0.12"
p256 = { version = "0.13", default-features = false, features = ["arithmetic"] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha1 = "0.10"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
