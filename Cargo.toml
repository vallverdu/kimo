[package]
name = "kimo"
version = "0.1.7"
edition = "2021"
description = "Agent development environment in Rust: a native app and a server for your Claude Code and Codex agents, with an API for your own apps"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["agents", "terminal", "claude", "codex", "pwa"]
categories = ["command-line-utilities", "development-tools"]
publish = false

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive", "env"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
libc = "0.2"
mime_guess = "2"
portable-pty = "0.9"
base64 = "0.22"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
# Rust API client (CLI, peers, window).
eframe = { version = "0.37", optional = true, default-features = false, features = ["glow", "x11", "wayland", "default_fonts"] }
alacritty_terminal = { version = "0.26", optional = true }
ureq = { version = "3", default-features = false, features = ["json"] }
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
# Desktop app (feature "desktop", on by default): native window and terminal emulator.

[features]
default = ["desktop"]
desktop = ["dep:eframe", "dep:alacritty_terminal"]

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
