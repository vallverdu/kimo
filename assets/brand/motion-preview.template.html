<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <link rel="icon" href="kimo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../web/css/tokens.css">
  <link rel="stylesheet" href="../../web/css/kimo.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--color-background); color: var(--color-ink); font: var(--font-size-base)/1.6 var(--font-family); }
    main { width: min(100% - 2 * var(--space-l), 880px); margin: auto; }
    header { padding: var(--space-xl) 0 var(--space-l); border-bottom: var(--line-thin) solid var(--color-line); display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-m); }
    h1 { margin: 0; font-size: var(--font-size-base); font-weight: var(--font-weight-regular); letter-spacing: var(--letter-spacing-section); }
    header span, .note, output, .stages { color: var(--color-muted); font-size: var(--font-size-small); }
    .stage { min-height: 400px; height: min(62vh, 580px); display: grid; place-items: center; }
    .stage > svg { display: block; width: min(100%, {{ART_WIDTH}}px); height: 100%; max-height: 450px; pointer-events: none; }
    .controls { padding: var(--space-l) 0; border-block: var(--line-thin) solid var(--color-line); }
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-s); }
    button, select { min-height: 44px; padding: var(--space-s) var(--space-m); border: var(--line-thin) solid var(--color-line); border-radius: var(--radius-s); background: var(--color-background); color: var(--color-ink); font: inherit; cursor: pointer; }
    button:hover, select:hover { border-color: var(--color-ink); }
    button:focus-visible, select:focus-visible, input:focus-visible { outline: var(--line-stroke) solid var(--color-teal); outline-offset: var(--space-xs); }
    output { margin-left: auto; font-variant-numeric: tabular-nums; }
    input[type=range] { width: 100%; margin: var(--space-l) 0 var(--space-s); accent-color: var(--color-ink); cursor: pointer; min-height: 28px; }
    .stages { display: flex; justify-content: space-between; }
    .stages span.active { color: var(--color-ink); }
    footer { display: flex; flex-wrap: wrap; justify-content: space-between; gap: var(--space-m); padding: var(--space-l) 0 var(--space-xl); }
    a { color: var(--color-ink); text-underline-offset: var(--space-xs); }
    footer nav { display: flex; gap: var(--space-l); font-size: var(--font-size-small); }
    @media (max-width: 480px) { main { width: calc(100% - 2 * var(--space-m)); } header { padding-top: var(--space-l); } header span { display: none; } .stage { min-height: 330px; height: 54vh; } button, select { padding-inline: var(--space-s); } }
  </style>
</head>
<body>
  <main>
    <header><h1>{{HEADING}}</h1><span>{{SUBTITLE}}</span></header>
    <div class="stage">{{ARTWORK}}</div>
    <div class="controls">
      <div class="toolbar">
        <button id="play" type="button">Pause</button>
        <button id="replay" type="button">Replay</button>
        <select id="theme" aria-label="Preview theme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select>
        <button id="motion" type="button" aria-pressed="false">Still</button>
        <output id="time" for="scrub">0.00 s</output>
      </div>
      <input id="scrub" aria-label="Animation time in seconds" type="range" min="0" max="{{DURATION}}" step="0.01" value="0">
      <div class="stages" aria-hidden="true"></div>
    </div>
    <footer>
      <span class="note">{{CAPTION}}</span>
      <nav aria-label="Logo files"><a href="{{AI_ASSET}}" download>Illustrator</a><a href="{{SVG_ASSET}}" download>SVG</a><a href="{{ASSET}}" download>Animation</a></nav>
    </footer>
  </main>
  <script>
    const timeline = {{TIMELINE}};
    const $ = id => document.getElementById(id);
    const reduced = matchMedia('(prefers-reduced-motion: reduce)');
    const svg = document.querySelector('.stage svg');
    let still = reduced.matches, frame;
    const stages = timeline.stages.map(([, label]) => {
      const span = document.createElement('span');
      span.textContent = label;
      document.querySelector('.stages').append(span);
      return span;
    });
    const ended = () => !timeline.loop && svg.getCurrentTime() >= timeline.duration;

    function appearance() {
      const theme = $('theme').value;
      document.documentElement.dataset.theme = theme;
      if (theme === 'system') delete document.documentElement.dataset.theme;
      if (!svg) return;
      svg.style.color = getComputedStyle(document.documentElement).getPropertyValue('--color-ink');
      svg.querySelector('.motion').style.display = still ? 'none' : 'inline';
      svg.querySelector('.still').style.display = still ? 'inline' : 'none';
      $('motion').setAttribute('aria-pressed', String(still));
      $('motion').textContent = still ? 'Animate' : 'Still';
      $('scrub').disabled = still;
      $('play').disabled = still;
      $('replay').disabled = still;
    }

    function update() {
      const elapsed = svg.getCurrentTime();
      const t = timeline.loop && elapsed > timeline.duration ? elapsed % timeline.duration : Math.min(elapsed, timeline.duration);
      $('scrub').value = t;
      $('time').textContent = `${t.toFixed(2)} / ${timeline.duration.toFixed(2)} s`;
      $('play').textContent = svg.animationsPaused() || ended() ? 'Play' : 'Pause';
      const phase = timeline.stages.reduce((active, [start], i) => t >= start ? i : active, 0);
      stages.forEach((el, i) => el.classList.toggle('active', i === phase));
      if (!svg.animationsPaused() && !ended() && !still) frame = requestAnimationFrame(update);
    }

    function play() {
      if (ended()) svg.setCurrentTime(0);
      svg.unpauseAnimations();
      cancelAnimationFrame(frame);
      update();
    }

    // Inline artwork keeps this preview usable directly from a local file.
    window.logoPreview = { svg, seek(t) { svg.pauseAnimations(); svg.setCurrentTime(t); update(); } };
    appearance();
    if (still) svg.pauseAnimations();
    update();
    $('play').onclick = () => { if (svg.animationsPaused() || ended()) play(); else { svg.pauseAnimations(); update(); } };
    $('replay').onclick = () => { svg.setCurrentTime(0); play(); };
    $('scrub').oninput = e => { svg.pauseAnimations(); svg.setCurrentTime(Number(e.target.value)); update(); };
    $('theme').onchange = appearance;
    $('motion').onclick = () => { still = !still; appearance(); if (still) svg.pauseAnimations(); else { svg.setCurrentTime(0); play(); } };
    reduced.addEventListener('change', () => { still = reduced.matches; appearance(); if (still) svg?.pauseAnimations(); else if (svg) play(); });
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', appearance);
  </script>
</body>
</html>
